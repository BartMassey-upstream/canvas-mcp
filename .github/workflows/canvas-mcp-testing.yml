name: Canvas MCP Enhancement Testing

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install locked quality tools
      run: |
        python -m pip install uv==0.12.18
        uv sync --frozen --group dev

    - name: Run Ruff
      run: uv run --frozen ruff check src/ tests/

    - name: Run mypy
      run: uv run --frozen mypy src/

  test-code-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install TypeScript dependencies
      run: npm ci
    - name: Build and test code API
      run: npm run build && npm test

  verify-confirmation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install pinned formal-verification tools
      run: |
        curl --fail --location --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
        echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
        tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
        curl --fail --location --retry 3 -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
        # verify/run.py checks the pinned jar digest before execution.
    - name: Prove the repaired machine and reproduce original counterexamples
      run: TLA_JAR="$RUNNER_TEMP/tla2tools.jar" python verify/run.py

  # Runs the WHOLE suite on every supported interpreter. pyproject declares
  # requires-python = ">=3.11" (3.10 dropped ahead of its 2026-10-31 EOL, #315),
  # so every version in the matrix is a supported target and a version-specific
  # break on the oldest one is invisible on a newer-only runner.
  test:
    runs-on: ubuntu-latest
    env:
      # FastMCP 4 temporarily bridges MCP SDK v1 camelCase attribute reads.
      # Keep the bridge off in CI so new code must use the v2 snake_case API.
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history: test_acceptance_replay_real_history replays the
        # closing-keyword checker over every real commit message. The default
        # shallow checkout has no `main` and no old commits, so the replay would
        # skip -- and a validator that only ever sees its own fixtures has not
        # earned its place.
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # pyyaml is needed by the workflow-permission policy tests. They use
        # importorskip, so omitting it makes them skip silently in the one job
        # branch protection actually requires — passing green while the check
        # they encode is never run.
        pip install pytest pytest-asyncio pyyaml

    - name: Run the test suite
      run: pytest tests/ -q

    - name: Build and inspect package archives
      if: matrix.python-version == '3.11'
      env:
        UV_CACHE_DIR: ${{ github.workspace }}/_package-ci/cache/uv
      run: |
        python -m pip install uv==0.12.18
        uv build --out-dir _package-ci/dist
        python scripts/verify_distribution.py --dist _package-ci/dist --output _package-ci/distribution-audit.json
        uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file _package-ci/runtime-requirements.txt > /dev/null
        uv venv --python "$(command -v python)" _package-ci/clean
        uv pip install --python _package-ci/clean/bin/python --require-hashes -r _package-ci/runtime-requirements.txt
        uv pip install --python _package-ci/clean/bin/python --no-deps _package-ci/dist/*.whl

    - name: Verify installed-wheel workflows over synthetic MCP stdio
      if: matrix.python-version == '3.11'
      env:
        XDG_CONFIG_HOME: ${{ github.workspace }}/_package-ci/config
        CANVAS_API_TOKEN: stage3-dummy-token
        CANVAS_API_URL: https://canvas.invalid/api/v1
        ACCESSIBILITY_CHECKERS: ufixit
      run: |
        python tests/workflows/run_stdio_acceptance.py --python _package-ci/clean/bin/python --output _package-ci/stdio-installed-workflows.json

  test-platform-config:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Install focused test dependencies
      run: python -m pip install -e . pytest pytest-asyncio
    - name: Test native configuration and token security
      run: python -m pytest tests/core/test_config.py tests/security/test_token_file.py -q

  # Aggregator. Branch protection requires a check literally named
  # "test-enhancements", and a matrix job publishes per-version names
  # ("test (3.11)"), which would leave the required check permanently pending
  # and block every PR. This gate keeps the required name while making it mean
  # "the full suite passed on every supported Python and the code API passed".
  test-enhancements:
    runs-on: ubuntu-latest
    needs: [lint, test, test-platform-config, test-code-api, verify-confirmation]
    if: always()

    steps:
    - name: Require lint, Python, code API, and confirmation proofs to have succeeded
      run: |
        echo "matrix result: ${{ needs.test.result }}"
        echo "platform config result: ${{ needs.test-platform-config.result }}"
        echo "lint result: ${{ needs.lint.result }}"
        if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.test-platform-config.result }}" != "success" ] || [ "${{ needs.test-code-api.result }}" != "success" ] || [ "${{ needs.verify-confirmation.result }}" != "success" ]; then
          echo "::error::Lint, Python, code API, or confirmation verification did not succeed."
          exit 1
        fi
        echo "## Canvas MCP test results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Full suite passed on 3.11, 3.12 and 3.13." >> $GITHUB_STEP_SUMMARY
